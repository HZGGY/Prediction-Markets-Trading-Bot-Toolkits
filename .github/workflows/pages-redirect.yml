name: Deploy github.io redirect to pnlpro.fit

# The marketing site moved to pnlpro.fit. This just uploads a tiny static
# redirect (pages/) so github.io/…/ 301s to the new domain — no build.

on:
  push:
    branches: [main]
    paths:
      - 'pages/**'
      - '.github/workflows/pages-redirect.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages
      - id: deployment
        uses: actions/deploy-pages@v4
