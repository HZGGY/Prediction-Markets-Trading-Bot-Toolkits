<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PnL Profit — redirecting…</title>
  <meta name="robots" content="noindex, follow" />
  <link rel="canonical" href="https://pnlpro.fit/" />
  <meta http-equiv="refresh" content="0; url=https://pnlpro.fit/" />
  <script>
    // Path-preserving redirect to the new domain (keeps /blog/* links working).
    (function () {
      var base = '/Prediction-Markets-Trading-Bot-Toolkits';
      var p = location.pathname.indexOf(base) === 0 ? location.pathname.slice(base.length) : location.pathname;
      location.replace('https://pnlpro.fit' + (p || '/') + location.search + location.hash);
    })();
  </script>
</head>
<body>
  Redirecting to <a href="https://pnlpro.fit/">pnlpro.fit</a>…
</body>
</html>
